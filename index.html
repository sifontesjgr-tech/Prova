<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xifontes - Grid de Vídeos</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow-y: scroll;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 10px;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        .video-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Proporción 16:9 */
            height: 0;
        }
        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <!-- VÍDEO 1 -->
        <div class="video-box">
            <iframe src="https://www.youtube.com/embed/Lmk-2cZhhc8?autoplay=1&mute=1&controls=0&loop=1&playlist=Lmk-2cZhhc8" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <!-- VÍDEO 2 -->
        <div class="video-box">
            <iframe src="https://www.youtube.com/embed/8SB0s6ypFts?autoplay=1&mute=1&controls=0&loop=1&playlist=8SB0s6ypFts" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        </div>
        <!-- VÍDEO 4 -->

            <iframe src="https://www.youtube.com/embed/_qbibe4__n8?autoplay=1&mute=1&controls=0&loop=1&playlist=_qbibe4__n8" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <!-- VÍDEO 5 -->

</body>
</html>
