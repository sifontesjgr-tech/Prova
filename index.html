<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Web con Video</title>
    <style>
        body, html {
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            overflow: hidden;
        }
        .video-container { 
            position: relative; 
            width: 100%; 
            height: 100%; 
        }
        iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/hdR4Sv1ivuE?autoplay=1&mute=1&controls=0&loop=1&playlist=hdR4Sv1ivuE" 
                allow="autoplay; encrypted-media" 
                allowfullscreen>
        </iframe>
    </div>
</body>
</html>
